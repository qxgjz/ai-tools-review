<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  body { margin: 0; background: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding: 40px 30px; }
  h1 { font-size: 22px; color: #111; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 18px; }
  #chart1 { width: 100%; height: 340px; }
  #chart2 { width: 100%; height: 320px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>n8n vs Zapier vs Make: Monthly Cost, Same Workload</h1>
  <div class="sub">5-step workflow, 500 runs/month (Zapier/Make billed per task/operation; n8n per workflow execution)</div>
  <div id="chart1"></div>
  <h1 style="margin-top:24px">n8n Cloud Plan Pricing (Annual Billing, EUR)</h1>
  <div class="sub">Every plan: unlimited users, unlimited workflows, unlimited steps, all integrations</div>
  <div id="chart2"></div>
</div>
<script>
const c1 = echarts.init(document.getElementById('chart1'));
c1.setOption({
  tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
  grid: { left: 90, right: 30, top: 30, bottom: 30 },
  xAxis: { type: 'category', data: ['n8n Self-hosted', 'n8n Cloud Starter', 'Make (Core)', 'Zapier (Professional)'], axisLabel: { fontSize: 12, interval: 0 } },
  yAxis: { type: 'value', name: 'USD / month', nameTextStyle: { fontSize: 12 } },
  series: [{
    type: 'bar',
    data: [
      { value: 7, itemStyle: { color: '#ea4b71' } },
      { value: 24, itemStyle: { color: '#ea4b71' } },
      { value: 16, itemStyle: { color: '#7b5dfa' } },
      { value: 49, itemStyle: { color: '#ff9f43' } }
    ],
    label: { show: true, position: 'top', formatter: '${c}/mo' },
    barWidth: 56
  }],
  backgroundColor: '#fff'
});
const c2 = echarts.init(document.getElementById('chart2'));
c2.setOption({
  tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
  grid: { left: 70, right: 40, top: 30, bottom: 30 },
  xAxis: { type: 'category', data: ['Community (self-host)', 'Starter', 'Pro', 'Business (self-host)'], axisLabel: { fontSize: 12, interval: 0 } },
  yAxis: { type: 'value', name: 'EUR / month', nameTextStyle: { fontSize: 12 } },
  series: [{
    type: 'bar',
    data: [
      { value: 0, itemStyle: { color: '#2ecc71' } },
      { value: 20, itemStyle: { color: '#ea4b71' } },
      { value: 50, itemStyle: { color: '#ea4b71' } },
      { value: 667, itemStyle: { color: '#8e44ad' } }
    ],
    label: { show: true, position: 'top', formatter: p => p.value === 0 ? 'Free / ∞ exec' : (p.value === 667 ? '€667/mo (40K exec)' : '€' + p.value + '/mo') },
    barWidth: 56
  }],
  backgroundColor: '#fff'
});
</script>
</body>
</html>
