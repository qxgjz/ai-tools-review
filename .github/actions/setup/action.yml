name: "Setup Node & Install Deps"
description: "Composite action: checkout + setup-node with npm cache + npm ci"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
    - run: npm ci
      shell: bash
