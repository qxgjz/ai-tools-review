name: Keyword Research

on:
  schedule:
    # Weekly Monday 05:00 Beijing time = Sunday 21:00 UTC
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keyword-research
  cancel-in-progress: false

jobs:
  keyword-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run keyword research
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python .github/scripts/keyword_research.py || echo "::warning::Keyword research had issues"
        continue-on-error: true

      - name: Commit results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iteration_center/keyword_research_results.json iteration_center/keyword_opportunities.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🔍 Keyword research $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
