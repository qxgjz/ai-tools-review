name: Unlighthouse Scan

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: unlighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run Unlighthouse
        run: npx @unlighthouse/cli ci --site https://www.aitoolcrux.com --reporter=json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: unlighthouse-results
          path: .lighthouse
