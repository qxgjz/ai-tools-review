name: Index Monitor

on:
  schedule:
    # Weekly Monday 04:00 Beijing time = Sunday 20:00 UTC
    - cron: '37 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-monitor
  cancel-in-progress: false

jobs:
  check-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-api-python-client google-auth httpx

      - name: Run index monitor
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python .github/scripts/index_monitor.py

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iteration_center/index_monitor.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📊 Index monitor $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
