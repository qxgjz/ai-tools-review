name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'iteration_center/**'
      - 'gsc-ga4-report/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8f173e72c551bbb5ebfc3bb54c878112
        run: npx wrangler pages deploy out --project-name=aitoolcrux --branch=main --account-id=8f173e72c551bbb5ebfc3bb54c878112

      - name: Wait for propagation
        run: sleep 45

      - name: Verify homepage
        run: |
          for i in 1 2 3; do
            if curl -sf -o /dev/null -w "%{http_code}" https://aitoolcrux.com/ | grep -q "200"; then
              echo "✅ Homepage OK"
              exit 0
            fi
            echo "Retry $i..."
            sleep 15
          done
          echo "❌ Homepage failed"
          exit 1

      - name: Verify blog
        run: |
          for i in 1 2 3; do
            if curl -sf -o /dev/null -w "%{http_code}" https://aitoolcrux.com/blog/ | grep -q "200"; then
              echo "✅ Blog OK"
              exit 0
            fi
            echo "Retry $i..."
            sleep 10
          done
          echo "❌ Blog failed"
          exit 1

      - name: Send success notification
        if: success()
        env:
          QQ_MAIL_USER: ${{ secrets.QQ_MAIL_USER }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
        run: |
          python -c "
          import smtplib, os
          from email.mime.text import MIMEText
          user = os.environ['QQ_MAIL_USER']
          pwd = os.environ['QQ_MAIL_AUTH_CODE']
          msg = MIMEText('<h2>✅ 部署成功</h2><p>Commit: ' + os.environ.get('GITHUB_SHA','')[:7] + '</p><p>网站已更新: https://aitoolcrux.com</p>', 'html')
          msg['Subject'] = '✅ AIToolCrux 部署成功'
          msg['From'] = user
          msg['To'] = user
          s = smtplib.SMTP_SSL('smtp.qq.com', 465)
          s.login(user, pwd)
          s.sendmail(user, [user], msg.as_string())
          s.quit()
          print('通知邮件已发送')
          " || echo "邮件发送失败（不影响部署）"

      - name: Send failure notification
        if: failure()
        env:
          QQ_MAIL_USER: ${{ secrets.QQ_MAIL_USER }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
        run: |
          python -c "
          import smtplib, os
          from email.mime.text import MIMEText
          user = os.environ['QQ_MAIL_USER']
          pwd = os.environ['QQ_MAIL_AUTH_CODE']
          msg = MIMEText('<h2>❌ 部署失败</h2><p>Commit: ' + os.environ.get('GITHUB_SHA','')[:7] + '</p><p>请检查GitHub Actions日志: https://github.com/qxgjz/ai-tools-review/actions</p>', 'html')
          msg['Subject'] = '❌ AIToolCrux 部署失败'
          msg['From'] = user
          msg['To'] = user
          s = smtplib.SMTP_SSL('smtp.qq.com', 465)
          s.login(user, pwd)
          s.sendmail(user, [user], msg.as_string())
          s.quit()
          print('告警邮件已发送')
          " || echo "邮件发送失败"
