name: Lighthouse CI

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'package.json'
      - 'next.config.mjs'
      - '.lighthouserc.json'

permissions:
  contents: read

concurrency:
  group: lighthouse-ci
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://www.aitoolcrux.com/
            https://www.aitoolcrux.com/tools/midjourney
            https://www.aitoolcrux.com/blog/perplexity-ai-review-2026
            https://www.aitoolcrux.com/compare
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: "./.lighthouserc.json"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 30
