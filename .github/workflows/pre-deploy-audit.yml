name: Pre-Deploy Full Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pre-deploy-audit
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Content Quality Audit (all articles)
        run: python scripts/full_audit.py --content-only
        continue-on-error: false

      - name: Technical SEO Audit (sample 50 pages)
        run: python scripts/full_audit.py --quick
        continue-on-error: false

      - name: Pre-Deploy Gate
        run: python scripts/pre_deploy_gate.py
        continue-on-error: false

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-audit-report
          path: iteration_center/full_audit_report.md
          retention-days: 30

      - name: Post audit summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '## Full Site Audit Report\n\n';
            try {
              report += fs.readFileSync('iteration_center/full_audit_report.md', 'utf8');
            } catch(e) {
              report += 'Report not generated.';
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report.substring(0, 65536)
            });
