name: Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'components/**'
      - 'tests/**'
      - 'package.json'
      - 'vitest.config.ts'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'components/**'
      - 'tests/**'
      - 'package.json'
      - 'vitest.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test

      - name: Run coverage
        run: npm run test:coverage
        if: always()

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
