name: Broken Link Audit

on:
  schedule:
    # Weekly Wednesday 05:00 Beijing time = Tuesday 21:00 UTC
    - cron: '0 21 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: broken-link-audit
  cancel-in-progress: false

jobs:
  audit-broken-links:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run broken link audit
        run: |
          python .github/scripts/broken_link_audit.py || echo "::warning::Broken link audit had issues"
        continue-on-error: true

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iteration_center/broken_links.json iteration_center/broken_links_report.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "🔗 Broken link audit $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
