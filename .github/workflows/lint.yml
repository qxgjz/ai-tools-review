name: Lint Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: ESLint (strict - blocks on errors)
        run: npx eslint .
      - name: Prettier auto-fix (formatting only, never fails build)
        run: |
          npx prettier --write "app/**/*.{ts,tsx,css}" "components/**/*.{ts,tsx}" "lib/**/*.ts"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: auto-format with prettier [skip ci]"
            git push
            echo "Formatted and pushed changes."
          fi
