name: Lint Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: ESLint
        run: npx eslint .
      - name: Prettier Check
        run: npx prettier --check "app/**/*.{ts,tsx,css}" "components/**/*.{ts,tsx}" "lib/**/*.ts"
