name: Quality Audit (Article Quality + Internal Links)

on:
  schedule:
    # Daily at 04:30 Beijing time = 20:30 UTC (after GSC fetch and SEO check)
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-audit
  cancel-in-progress: false

jobs:
  quality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run quality audit
        run: |
          python scripts/quality_audit.py || echo "::warning::Quality audit script had issues"
        continue-on-error: true

      - name: Run internal link analysis
        run: |
          if [ -f scripts/internal_link_audit.py ]; then
            python scripts/internal_link_audit.py || echo "::warning::Internal link audit had issues"
          else
            echo "Internal link audit script not found, skipping"
          fi
        continue-on-error: true

      - name: Generate P0/P1 todo list from audit
        run: |
          python .github/scripts/generate_audit_todos.py || echo "::warning::Todo generation had issues"
        continue-on-error: true

      - name: Commit reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iteration_center/quality_audit_report.md iteration_center/quality_audit_results.json iteration_center/internal_link_audit.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "📊 Quality audit $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
