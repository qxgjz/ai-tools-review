name: Pain Point Collector

on:
  schedule:
    # Weekly Tuesday 05:00 Beijing time = Monday 21:00 UTC
    - cron: '0 21 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pain-point-collector
  cancel-in-progress: false

jobs:
  collect-pain-points:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Collect pain points from Reddit & search
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python .github/scripts/pain_point_collector.py || echo "::warning::Pain point collection had issues"
        continue-on-error: true

      - name: Commit results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iteration_center/pain_points_raw.json iteration_center/pain_points_summary.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "💬 Pain point data collected $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
