name: Auto Optimize Website

on:
  workflow_run:
    workflows: ["Weekly Website Optimization Diagnosis"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to optimize (or all)'
        required: false
        default: 'all'
      priority:
        description: 'Priority level to execute (P0, P1, P2, or all)'
        required: false
        default: 'P0'

permissions:
  contents: write
  pull-requests: write

env:
  WEBSITE_URL: https://www.aitoolcrux.com
  DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
  DOUBAO_ENDPOINT_ID: ${{ secrets.DOUBAO_ENDPOINT_ID }}

jobs:
  execute-optimizations:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests httpx python-dotenv

      - name: Get latest diagnosis reports
        run: |
          echo "Fetching latest diagnosis reports..."
          
          # 找到最新的报告目录
          LATEST_REPORT_DIR=$(ls -td reports/*/ | head -1)
          echo "Latest report directory: $LATEST_REPORT_DIR"
          
          echo "report_dir=$LATEST_REPORT_DIR" >> $GITHUB_ENV

      - name: Execute P0 optimizations
        id: execute
        run: |
          echo "Executing P0 optimizations..."
          
          python .github/scripts/execute_optimizations.py \
            --reports-dir "${{ env.report_dir }}" \
            --priority "P0" \
            --module "${{ github.event.inputs.module || 'all' }}" \
            --output-dir "optimizations/$(date +%Y-%m-%d)"
          
          # 检查是否有代码修改
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Optimizations executed with code changes"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No code changes needed"
          fi

      - name: Create optimization branch
        if: steps.execute.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="auto-optimization-$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          git checkout -b "$BRANCH_NAME"
          git add -A
          git commit -m "🤖 Auto optimization - P0 issues - $(date +%Y-%m-%d)

Generated by GitHub Actions auto-optimize workflow.
Based on weekly diagnosis reports.
Priority: P0
Module: ${{ github.event.inputs.module || 'all' }}"

      - name: Create Pull Request
        if: steps.execute.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Auto optimization - P0 issues"
          title: "🤖 Auto Optimization - P0 Issues - $(date +%Y-%m-%d)"
          body: |
            ## Auto Optimization Report
            
            This PR was automatically generated by the GitHub Actions auto-optimize workflow.
            
            ### Changes Summary
            - Based on latest diagnosis reports
            - Priority: P0 (critical issues blocking indexing/ranking)
            - Module: ${{ github.event.inputs.module || 'all' }}
            
            ### Verification
            - [ ] Build passes
            - [ ] No regressions
            - [ ] Changes are reversible
            
            ### Next Steps
            1. Review the changes
            2. Run local build to verify
            3. Merge if everything looks good
            4. Vercel will auto-deploy after merge
            
            ---
            *Generated by AI automation system*
          labels: |
            auto-optimization
            P0
            seo
          reviewers: qxgjz
          draft: false

      - name: Upload optimization log
        uses: actions/upload-artifact@v4
        with:
          name: optimization-log-${{ github.run_id }}
          path: optimizations/
          retention-days: 90
