name: SEO Check (Full Audit)

on:
  schedule:
    # Daily at 03:11 Beijing time = 19:11 UTC
    - cron: '11 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-check
  cancel-in-progress: false

jobs:
  seo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Full Site Audit (quick mode)
        run: python scripts/full_audit.py --quick
        continue-on-error: true

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iteration_center/full_audit_report.md iteration_center/full_audit_results.json
          git diff --staged --quiet || git commit -m "🔍 Full SEO audit $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
