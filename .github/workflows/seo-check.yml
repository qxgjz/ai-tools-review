name: SEO Check

on:
  schedule:
    # Daily at 03:11 Beijing time = 19:11 UTC
    - cron: '11 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-check
  cancel-in-progress: false

jobs:
  seo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run SEO check
        run: python .github/scripts/seo_check.py

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add iteration_center/seo_check_latest.md
          git diff --staged --quiet || git commit -m "🔍 SEO check $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
