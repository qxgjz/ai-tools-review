name: Weekly Website Optimization Diagnosis

on:
  schedule:
    # 每周一早上8点（UTC）运行 = 北京时间下午4点
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write
  issues: write

env:
  WEBSITE_URL: https://www.aitoolcrux.com
  DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
  DOUBAO_ENDPOINT_ID: ${{ secrets.DOUBAO_ENDPOINT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - orchestrator
          - crawlability
          - renderability
          - indexability
          - core_web_vitals
          - tool_page_content
          - article_page_content
          - category_page_content
          - eeat
          - structured_data
          - internal_linking
          - link_building
          - conversion_rate
      fail-fast: false
      max-parallel: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests httpx python-dotenv

      - name: Run diagnosis for ${{ matrix.module }}
        id: diagnose
        run: |
          echo "Running diagnosis for module: ${{ matrix.module }}"
          
          # 找到对应的提示词文件
          if [ "${{ matrix.module }}" = "orchestrator" ]; then
            PROMPT_FILE="prompts/00-orchestrator.json"
          else
            PROMPT_FILE=$(find prompts -name "*${{ matrix.module }}.json" | head -1)
          fi
          
          echo "Prompt file: $PROMPT_FILE"
          
          # 运行诊断脚本
          python .github/scripts/run_diagnosis.py \
            --module "${{ matrix.module }}" \
            --prompt-file "$PROMPT_FILE" \
            --output-dir "reports/$(date +%Y-%m-%d)" \
            --website-url "$WEBSITE_URL"
          
          # 检查是否生成了报告
          REPORT_FILE="reports/$(date +%Y-%m-%d)/${{ matrix.module }}-report.json"
          if [ -f "$REPORT_FILE" ]; then
            echo "report_exists=true" >> $GITHUB_OUTPUT
            echo "report_path=$REPORT_FILE" >> $GITHUB_OUTPUT
            echo "Report generated successfully"
          else
            echo "report_exists=false" >> $GITHUB_OUTPUT
            echo "Report generation failed"
          fi

      - name: Upload report artifact
        if: steps.diagnose.outputs.report_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.module }}-${{ github.run_id }}
          path: ${{ steps.diagnose.outputs.report_path }}
          retention-days: 90

  summarize:
    needs: diagnose
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: report-*
          merge-multiple: true

      - name: Generate summary report
        run: |
          echo "Generating summary report..."
          python .github/scripts/generate_summary.py \
            --reports-dir "all-reports" \
            --output "reports/$(date +%Y-%m-%d)/SUMMARY.md"
          
          cat "reports/$(date +%Y-%m-%d)/SUMMARY.md"

      - name: Commit reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add reports/
          git commit -m "📊 Weekly website optimization diagnosis - $(date +%Y-%m-%d)

Generated by GitHub Actions weekly diagnosis workflow.
Modules: orchestrator, crawlability, renderability, indexability, core_web_vitals, 
tool_page_content, article_page_content, category_page_content, eeat, 
structured_data, internal_linking, link_building, conversion_rate" || echo "No changes to commit"
          
          git push

      - name: Create GitHub Issue for P0 issues
        run: |
          echo "Checking for P0 issues..."
          python .github/scripts/create_p0_issues.py \
            --reports-dir "all-reports" \
            --github-token "${{ secrets.GITHUB_TOKEN }}"
