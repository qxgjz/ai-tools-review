name: GSC Data Fetch

on:
  schedule:
    # Daily at 02:00 Beijing time = 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-gsc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-api-python-client google-auth

      - name: Fetch GSC data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python .github/scripts/fetch_gsc.py

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gsc-ga4-report/
          git diff --staged --quiet || git commit -m "📊 GSC data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
