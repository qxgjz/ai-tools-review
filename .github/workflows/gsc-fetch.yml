name: GSC Data Fetch

on:
  schedule:
    # Daily at 02:23 Beijing time = 18:23 UTC
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gsc-fetch
  cancel-in-progress: false

jobs:
  fetch-gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-api-python-client google-auth

      - name: Fetch GSC data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python .github/scripts/fetch_gsc.py || {
            echo "::error::GSC fetch failed. Check GOOGLE_SERVICE_ACCOUNT_JSON secret."
            exit 1
          }

      - name: Commit report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gsc-ga4-report/
          if git diff --staged --quiet; then
            echo "No new GSC report to commit"
            exit 0
          fi
          git commit -m "📊 GSC data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
