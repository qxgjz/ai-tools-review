version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 0  # Disabled: action version bumps broke CI and flooded failure emails
    labels:
      - "dependencies"
      - "github-actions"
