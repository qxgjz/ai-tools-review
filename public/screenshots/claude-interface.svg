<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f9f9f9"/>
  <!-- Sidebar -->
  <rect width="240" height="500" fill="#ffffff"/>
  <rect x="0" y="0" width="240" height="500" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="30" cy="30" r="12" fill="#D97757"/>
  <text x="50" y="35" font-family="sans-serif" font-size="14" font-weight="600" fill="#333">Claude</text>
  <rect x="15" y="60" width="210" height="36" rx="8" fill="#f0f0f0"/>
  <text x="25" y="83" font-family="sans-serif" font-size="13" fill="#666">New chat</text>
  <text x="20" y="120" font-family="sans-serif" font-size="11" font-weight="600" fill="#999">Recent</text>
  <rect x="15" y="130" width="210" height="28" rx="4" fill="transparent"/>
  <text x="25" y="148" font-family="sans-serif" font-size="12" fill="#555">Code review for PR #234</text>
  <rect x="15" y="162" width="210" height="28" rx="4" fill="transparent"/>
  <text x="25" y="180" font-family="sans-serif" font-size="12" fill="#555">Writing blog post draft</text>
  <rect x="15" y="194" width="210" height="28" rx="4" fill="transparent"/>
  <text x="25" y="212" font-family="sans-serif" font-size="12" fill="#555">Analyze quarterly report</text>
  <!-- Main chat area -->
  <rect x="240" y="0" width="560" height="500" fill="#f9f9f9"/>
  <rect x="260" y="40" width="520" height="80" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="280" y="65" font-family="sans-serif" font-size="13" font-weight="600" fill="#333">You</text>
  <text x="280" y="88" font-family="sans-serif" font-size="13" fill="#555">Can you help me write a product</text>
  <text x="280" y="105" font-family="sans-serif" font-size="13" fill="#555">launch announcement email?</text>
  <rect x="260" y="140" width="520" height="200" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <circle cx="280" cy="165" r="10" fill="#D97757"/>
  <text x="300" y="170" font-family="sans-serif" font-size="13" font-weight="600" fill="#333">Claude</text>
  <text x="280" y="195" font-family="sans-serif" font-size="13" fill="#444">Absolutely! Here is a compelling product</text>
  <text x="280" y="215" font-family="sans-serif" font-size="13" fill="#444">launch email that balances excitement</text>
  <text x="280" y="235" font-family="sans-serif" font-size="13" fill="#444">with clarity:</text>
  <text x="280" y="260" font-family="sans-serif" font-size="13" font-weight="600" fill="#333">Subject: Introducing [Product] —</text>
  <text x="280" y="278" font-family="sans-serif" font-size="13" font-weight="600" fill="#333">Built for [Your Goal]</text>
  <text x="280" y="305" font-family="sans-serif" font-size="13" fill="#444">Hi [Name],</text>
  <text x="280" y="323" font-family="sans-serif" font-size="13" fill="#444">After months of development...</text>
  <!-- Input box -->
  <rect x="260" y="420" width="520" height="50" rx="24" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  <text x="280" y="450" font-family="sans-serif" font-size="13" fill="#aaa">Message Claude...</text>
  <circle cx="750" cy="445" r="14" fill="#D97757"/>
  <text x="746" y="450" font-family="sans-serif" font-size="14" fill="white">↑</text>
</svg>