<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#202124">Claude vs Gemini: 8-Dimension Score Comparison</text>
  <!-- Chart area -->
  <rect x="60" y="70" width="680" height="280" fill="#f8f9fa" rx="12"/>
  <!-- Grid lines -->
  <line x1="120" y1="100" x2="720" y2="100" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="120" y1="160" x2="720" y2="160" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="120" y1="220" x2="720" y2="220" stroke="#e0e0e0" stroke-width="1"/>
  <line x1="120" y1="280" x2="720" y2="280" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Y axis labels -->
  <text x="110" y="105" text-anchor="end" font-family="sans-serif" font-size="11" fill="#666">10</text>
  <text x="110" y="165" text-anchor="end" font-family="sans-serif" font-size="11" fill="#666">7.5</text>
  <text x="110" y="225" text-anchor="end" font-family="sans-serif" font-size="11" fill="#666">5</text>
  <text x="110" y="285" text-anchor="end" font-family="sans-serif" font-size="11" fill="#666">2.5</text>
  <!-- Bars - Claude -->
  <rect x="150" y="110" width="40" height="190" fill="#D97757" rx="4"/>
  <rect x="230" y="120" width="40" height="180" fill="#D97757" rx="4"/>
  <rect x="310" y="130" width="40" height="170" fill="#D97757" rx="4"/>
  <rect x="390" y="115" width="40" height="185" fill="#D97757" rx="4"/>
  <!-- Bars - Gemini -->
  <rect x="195" y="125" width="40" height="175" fill="#4285f4" rx="4"/>
  <rect x="275" y="115" width="40" height="185" fill="#4285f4" rx="4"/>
  <rect x="355" y="105" width="40" height="195" fill="#4285f4" rx="4"/>
  <rect x="435" y="130" width="40" height="170" fill="#4285f4" rx="4"/>
  <!-- X axis labels -->
  <text x="190" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Writing</text>
  <text x="270" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Coding</text>
  <text x="350" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Research</text>
  <text x="430" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Analysis</text>
  <!-- Legend -->
  <rect x="550" y="90" width="16" height="16" fill="#D97757" rx="2"/>
  <text x="575" y="103" font-family="sans-serif" font-size="12" fill="#333">Claude</text>
  <rect x="550" y="115" width="16" height="16" fill="#4285f4" rx="2"/>
  <text x="575" y="128" font-family="sans-serif" font-size="12" fill="#333">Gemini</text>
  <!-- Score labels -->
  <text x="170" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D97757">9.2</text>
  <text x="215" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4285f4">8.5</text>
  <text x="250" y="115" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D97757">8.8</text>
  <text x="295" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4285f4">9.1</text>
</svg>