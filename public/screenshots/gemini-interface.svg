<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="56" fill="#ffffff" stroke="#e8eaed" stroke-width="1"/>
  <text x="24" y="36" font-family="sans-serif" font-size="20" font-weight="500" fill="#202124">Gemini</text>
  <rect x="700" y="14" width="72" height="28" rx="14" fill="#1a73e8"/>
  <text x="718" y="33" font-family="sans-serif" font-size="12" font-weight="500" fill="white">Try Advanced</text>
  <!-- Chat area -->
  <rect x="40" y="80" width="720" height="100" rx="16" fill="#f8f9fa"/>
  <text x="60" y="110" font-family="sans-serif" font-size="14" fill="#202124">Explain quantum computing in simple terms</text>
  <text x="60" y="135" font-family="sans-serif" font-size="14" fill="#202124">and give me a real-world analogy.</text>
  <rect x="40" y="200" width="720" height="180" rx="16" fill="#ffffff" stroke="#e8eaed" stroke-width="1"/>
  <circle cx="60" cy="225" r="12" fill="#4285f4"/>
  <text x="57" y="230" font-family="sans-serif" font-size="12" font-weight="bold" fill="white">G</text>
  <text x="80" y="230" font-family="sans-serif" font-size="14" font-weight="500" fill="#202124">Gemini</text>
  <text x="60" y="260" font-family="sans-serif" font-size="14" fill="#3c4043">Think of quantum computing like a library. A</text>
  <text x="60" y="282" font-family="sans-serif" font-size="14" fill="#3c4043">classical computer reads one book at a time,</text>
  <text x="60" y="304" font-family="sans-serif" font-size="14" fill="#3c4043">page by page. A quantum computer can read</text>
  <text x="60" y="326" font-family="sans-serif" font-size="14" fill="#3c4043">multiple books simultaneously, exploring all</text>
  <text x="60" y="348" font-family="sans-serif" font-size="14" fill="#3c4043">possible answers at once. This makes it</text>
  <text x="60" y="370" font-family="sans-serif" font-size="14" fill="#3c4043">incredibly powerful for optimization problems.</text>
  <!-- Google Search integration -->
  <rect x="40" y="395" width="720" height="40" rx="8" fill="#e8f0fe"/>
  <text x="60" y="420" font-family="sans-serif" font-size="12" fill="#1a73e8">🔍 Sources: Google Search results used for this answer</text>
  <!-- Input -->
  <rect x="40" y="450" width="640" height="40" rx="20" fill="#f1f3f4"/>
  <text x="60" y="475" font-family="sans-serif" font-size="14" fill="#9aa0a6">Enter a prompt here</text>
  <circle cx="720" cy="470" r="16" fill="#1a73e8"/>
  <text x="716" y="475" font-family="sans-serif" font-size="14" fill="white">↑</text>
</svg>