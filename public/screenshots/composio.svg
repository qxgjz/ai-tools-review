  <circle cx="25" cy="25" r="8" fill="#ef4444"/>
  <circle cx="45" cy="25" r="8" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="8" fill="#22c55e"/>
  <text x="100" y="30" fill="#94a3b8" font-family="Arial" font-size="12">Composio</text>

  <!-- 侧边栏 -->
  <rect x="0" y="50" width="180" height="450" fill="#0f172a" opacity="0.85"/>
  <text x="20" y="85" fill="#f1f5f9" font-family="Arial" font-size="14" font-weight="bold">Composio</text>
  <text x="20" y="105" fill="#64748b" font-family="Arial" font-size="10">Agent Tooling Platform</text>

  <!-- 侧边栏菜单项 -->
  <rect x="10" y="125" width="160" height="30" rx="5" fill="#334155" opacity="0.6"/>
