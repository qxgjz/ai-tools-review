  <circle cx="240" cy="290" r="6" fill="#0ea5e9"/>
  <text x="258" y="294" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">100+ Tool Integrations</text>
  <text x="258" y="310" fill="#64748b" font-family="Arial" font-size="10">Pre-built connectors for popular apps and APIs</text>
  <circle cx="240" cy="328" r="6" fill="#0ea5e9"/>
  <text x="258" y="332" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">Agent Framework Agnostic</text>
  <text x="258" y="348" fill="#64748b" font-family="Arial" font-size="10">Works with LangChain, LlamaIndex, AutoGPT, CrewAI</text>
  <circle cx="240" cy="366" r="6" fill="#0ea5e9"/>
  <text x="258" y="370" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">OAuth & Auth Management</text>
  <text x="258" y="386" fill="#64748b" font-family="Arial" font-size="10">Secure authentication handling for all integrations</text>
  <circle cx="240" cy="404" r="6" fill="#0ea5e9"/>
  <text x="258" y="408" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">Trigger & Actions</text>
  <text x="258" y="424" fill="#64748b" font-family="Arial" font-size="10">Event-driven automation with webhooks and triggers</text>
  <circle cx="240" cy="442" r="6" fill="#0ea5e9"/>
  <text x="258" y="446" fill="#334155" font-family="Arial" font-size="12" font-weight="bold">Monitoring & Logging</text>
  <text x="258" y="462" fill="#64748b" font-family="Arial" font-size="10">Track agent tool usage and performance metrics</text>

  <!-- 底部活动日志 -->
  <rect x="225" y="450" width="535" height="20" rx="4" fill="#f8fafc"/>
  <circle cx="238" cy="460" r="3" fill="#22c55e"/>
  <text x="250" y="464" fill="#64748b" font-family="Arial" font-size="9">System operational · Last updated: just now</text>
