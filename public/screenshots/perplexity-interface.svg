<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17a2b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Top Navigation -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f0f1a" opacity="0.8"/>
  <circle cx="40" cy="30" r="14" fill="url(#accent)"/>
  <text x="40" y="35" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">P</text>
  <text x="70" y="36" font-family="Arial, sans-serif" font-size="16" fill="white" font-weight="600">Perplexity</text>
  
  <!-- Search Bar -->
  <rect x="300" y="12" width="500" height="36" rx="18" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
  <text x="320" y="35" font-family="Arial, sans-serif" font-size="13" fill="#8888aa">Ask anything...</text>
  <circle cx="780" cy="30" r="12" fill="url(#accent)"/>
  <text x="780" y="34" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">→</text>
  
  <!-- Main Query Area -->
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">What are the best AI tools for developers in 2026?</text>
  
  <!-- Answer Card -->
  <rect x="80" y="150" width="750" height="280" rx="12" fill="#1e1e3a" stroke="#2e2e4e" stroke-width="1"/>
  
  <!-- Sources -->
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="11" fill="#20c997" font-weight="600">6 SOURCES</text>
  <rect x="100" y="190" width="60" height="20" rx="4" fill="#2a2a4a"/>
  <text x="130" y="204" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc" text-anchor="middle">GitHub</text>
  <rect x="170" y="190" width="60" height="20" rx="4" fill="#2a2a4a"/>
  <text x="200" y="204" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc" text-anchor="middle">Stack</text>
  <rect x="240" y="190" width="60" height="20" rx="4" fill="#2a2a4a"/>
  <text x="270" y="204" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc" text-anchor="middle">Dev.to</text>
  <rect x="310" y="190" width="60" height="20" rx="4" fill="#2a2a4a"/>
  <text x="340" y="204" font-family="Arial, sans-serif" font-size="10" fill="#aaaacc" text-anchor="middle">Medium</text>
  
  <!-- Answer Text -->
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="14" fill="#ddddee">Based on recent developer surveys and GitHub trends,</text>
  <text x="100" y="262" font-family="Arial, sans-serif" font-size="14" fill="#ddddee">the top AI coding tools in 2026 include:</text>
  
  <text x="100" y="295" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="600">1. GitHub Copilot</text>
  <text x="120" y="315" font-family="Arial, sans-serif" font-size="13" fill="#aaaacc">— Most widely adopted, 60% developer usage rate</text>
  
  <text x="100" y="345" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="600">2. Cursor</text>
  <text x="120" y="365" font-family="Arial, sans-serif" font-size="13" fill="#aaaacc">— Fastest growing, AI-native code editor</text>
  
  <text x="100" y="395" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="600">3. Windsurf</text>
  <text x="120" y="415" font-family="Arial, sans-serif" font-size="13" fill="#aaaacc">— Cascade agent for multi-file refactoring</text>
  
  <!-- Right Sidebar - Pro Card -->
  <rect x="870" y="150" width="250" height="180" rx="12" fill="url(#accent)" opacity="0.15" stroke="#20c997" stroke-width="1"/>
  <text x="890" y="185" font-family="Arial, sans-serif" font-size="16" fill="#20c997" font-weight="700">Perplexity Pro</text>
  <text x="890" y="215" font-family="Arial, sans-serif" font-size="28" fill="white" font-weight="700">$20/mo</text>
  <text x="890" y="245" font-family="Arial, sans-serif" font-size="12" fill="#aaaacc">Unlimited AI searches</text>
  <text x="890" y="265" font-family="Arial, sans-serif" font-size="12" fill="#aaaacc">GPT-4o & Claude 3.5 access</text>
  <text x="890" y="285" font-family="Arial, sans-serif" font-size="12" fill="#aaaacc">File upload & analysis</text>
  <rect x="890" y="300" width="210" height="32" rx="16" fill="url(#accent)"/>
  <text x="995" y="321" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="600">Upgrade to Pro</text>
  
  <!-- Bottom Stats -->
  <rect x="80" y="460" width="220" height="80" rx="10" fill="#1e1e3a" stroke="#2e2e4e"/>
  <text x="100" y="490" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Response Time</text>
  <text x="100" y="520" font-family="Arial, sans-serif" font-size="24" fill="#20c997" font-weight="700">2.4s</text>
  
  <rect x="320" y="460" width="220" height="80" rx="10" fill="#1e1e3a" stroke="#2e2e4e"/>
  <text x="340" y="490" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Citations</text>
  <text x="340" y="520" font-family="Arial, sans-serif" font-size="24" fill="#17a2b8" font-weight="700">6</text>
  
  <rect x="560" y="460" width="220" height="80" rx="10" fill="#1e1e3a" stroke="#2e2e4e"/>
  <text x="580" y="490" font-family="Arial, sans-serif" font-size="11" fill="#8888aa">Accuracy Score</text>
  <text x="580" y="520" font-family="Arial, sans-serif" font-size="24" fill="#ffc107" font-weight="700">94%</text>
  
  <!-- Thread History -->
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="600">Related Questions</text>
  <rect x="80" y="605" width="1040" height="40" rx="8" fill="#1e1e3a" stroke="#2e2e4e"/>
  <text x="100" y="630" font-family="Arial, sans-serif" font-size="13" fill="#aaaacc">How does Perplexity compare to Google Search for coding queries?</text>
  
  <rect x="80" y="655" width="1040" height="40" rx="8" fill="#1e1e3a" stroke="#2e2e4e"/>
  <text x="100" y="680" font-family="Arial, sans-serif" font-size="13" fill="#aaaacc">What are the pricing tiers for Perplexity API access?</text>
  
  <rect x="80" y="705" width="1040" height="40" rx="8" fill="#1e1e3a" stroke="#2e2e4e"/>
  <text x="100" y="730" font-family="Arial, sans-serif" font-size="13" fill="#aaaacc">Can Perplexity generate code snippets with citations?</text>
</svg>